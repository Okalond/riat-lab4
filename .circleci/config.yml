version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-test-v1-py311-{{ checksum "requirements.txt" }}
            - pip-test-v1-py311-
      - run:
          name: Install dependencies
          command: python -m pip install -r requirements.txt
      - save_cache:
          key: pip-test-v1-py311-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            python -m pytest --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-lint-v1-py311-{{ checksum "requirements-dev.txt" }}-{{ checksum "requirements.txt" }}
            - pip-lint-v1-py311-
      - run:
          name: Install formatting tools
          command: python -m pip install -r requirements-dev.txt
      - save_cache:
          key: pip-lint-v1-py311-{{ checksum "requirements-dev.txt" }}-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check code formatting
          command: python -m black --check app.py test_app.py

workflows:
  build-and-test:
    jobs:
      - test
      - lint
